golden_queries:
  - name: revenue_by_plan_monthly
    description: "Monthly revenue breakdown by subscription plan"
    sql: |
      SELECT 
        DATE_TRUNC('month', p.payment_date)::DATE AS month,
        s.plan,
        COUNT(DISTINCT s.subscription_id) AS subscription_count,
        SUM(p.amount_usd) AS total_revenue
      FROM payments p
      JOIN subscriptions s ON p.subscription_id = s.subscription_id
      GROUP BY DATE_TRUNC('month', p.payment_date), s.plan
      ORDER BY month DESC, s.plan;
    
  - name: active_users_by_country
    description: "Count of users with active subscriptions, by country"
    sql: |
      SELECT 
        u.country,
        COUNT(DISTINCT u.user_id) AS active_user_count
      FROM users u
      JOIN subscriptions s ON u.user_id = s.user_id
      WHERE s.status = 'active'
      GROUP BY u.country
      ORDER BY active_user_count DESC;
    
  - name: session_activity_summary
    description: "Session count and total duration by activity type"
    sql: |
      SELECT 
        activity_type,
        COUNT(session_id) AS session_count,
        SUM(duration_minutes) AS total_minutes,
        AVG(duration_minutes) AS avg_session_minutes
      FROM sessions
      GROUP BY activity_type
      ORDER BY session_count DESC;
    
  - name: top_payment_methods
    description: "Most popular payment methods (by transaction count and revenue)"
    sql: |
      SELECT 
        method,
        COUNT(payment_id) AS payment_count,
        SUM(amount_usd) AS total_revenue,
        AVG(amount_usd) AS avg_payment
      FROM payments
      GROUP BY method
      ORDER BY total_revenue DESC;
    
  - name: user_lifetime_value
    description: "Total spend per user (lifetime value)"
    sql: |
      SELECT 
        u.user_id,
        u.country,
        u.device_type,
        u.signup_date,
        COUNT(DISTINCT s.subscription_id) AS subscription_count,
        SUM(p.amount_usd) AS lifetime_value
      FROM users u
      LEFT JOIN subscriptions s ON u.user_id = s.user_id
      LEFT JOIN payments p ON s.subscription_id = p.subscription_id
      GROUP BY u.user_id, u.country, u.device_type, u.signup_date
      ORDER BY lifetime_value DESC;
